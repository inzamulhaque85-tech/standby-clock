plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.standby_android'
    compileSdk 37

    defaultConfig {
        applicationId 'com.example.standby_android'
        minSdk 33
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
